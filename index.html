<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#e79bb4" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="format-detection" content="telephone=no" />
<title>字卡传讯 · 与梦角</title>
<link id="faviconLink" rel="icon" href="data:," />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="opening" class="opening" data-style="orb">
  <div class="sky" id="openingSky">
    <div class="neb n1"></div>
    <div class="neb n2"></div>
    <div class="shoot"></div>
  </div>
  <div class="opening-inner">
    <div class="opening-anim">
      <div class="opening-ring r1"></div>
      <div class="opening-ring r2"></div>
      <div class="opening-orb"></div>
      <div class="opening-spark s1">✦</div>
      <div class="opening-spark s2">✧</div>
      <div class="opening-spark s3">✦</div>
    </div>
    <div id="openingText" class="opening-text"></div>
    <div id="openingSub" class="opening-sub"></div>
    <button id="openingEnter" class="btn primary round">进 入</button>
    <div class="opening-hint">点击任意位置进入</div>
  </div>
</div>

<div class="app" id="app">
  <header class="head">
    <div class="head-row">
      <button class="ava-box" id="peerBox" title="双击头像可以拍一拍">
        <span id="peerAvatar" class="avatar txt ava-lg">🌙</span>
        <span class="ava-label on" id="peerLabel">在线</span>
        <span class="ava-sub" id="peerStatus">梦角</span>
      </button>

      <nav class="icon-cluster">
        <button class="ico-btn" id="btnCall" title="通话">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
        </button>
        <button class="ico-btn" id="btnDiary" title="心情手账">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
        </button>
        <button class="ico-btn" id="btnFav" title="收藏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          <i class="badge" id="favBadge" hidden>0</i>
        </button>
        <button class="ico-btn" id="btnLetterTop" title="写信">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <i class="badge" id="letterBadge" hidden>0</i>
        </button>
        <button class="ico-btn" id="btnSettings" title="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.6 14.6a1.7 1.7 0 0 0 .34 1.9l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.9-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.56 1.7 1.7 0 0 0-1.9.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.9 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.56-1.1 1.7 1.7 0 0 0-.34-1.9l-.06-.06A2 2 0 1 1 7.09 4.7l.06.06a1.7 1.7 0 0 0 1.9.34H9.1a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.9-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.9v.08a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.56 1.03z"/></svg>
        </button>
      </nav>

      <button class="ava-box" id="myAvatarBtn" title="我的信息">
        <span id="myAvatarBox" class="avatar txt ava-lg">🌸</span>
        <span class="ava-label" id="myLabel">我</span>
      </button>
    </div>
  </header>

  <main class="chat" id="chatList"></main>

  <div class="quick-bar" id="quickBar" hidden>
    <button class="chip" data-quick="letter">✉️ 写信</button>
    <button class="chip" data-quick="pat">👋 拍一拍</button>
    <button class="chip" data-quick="call">📞 通话</button>
    <button class="chip" data-quick="sticker">😀 表情</button>
    <button class="chip" data-quick="diary">📔 心情手账</button>
    <button class="chip" data-quick="fav">⭐ 收藏</button>
  </div>

  <div class="quote-bar" id="quoteBar" hidden>
    <span class="q-ico">❝</span><div class="q-text" id="quoteText"></div>
    <button class="q-close" id="quoteClose">✕</button>
  </div>
  <div class="attach-bar" id="attachBar" hidden>
    <img id="attachImg" alt="" /><span class="a-txt" id="attachTxt">图片将随消息发送</span>
    <button id="attachClose">✕</button>
  </div>

  <footer class="composer">
    <button class="circ" id="btnImage" title="发送图片">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="m21 15-4.5-4.5L7 20"/></svg>
    </button>
    <button class="circ" id="btnSticker" title="表情包">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.3 2 3.5 2 3.5-2 3.5-2"/><path d="M9 9.5h.01M15 9.5h.01"/></svg>
    </button>
    <textarea id="input" rows="1" maxlength="500" placeholder="说点什么…"></textarea>
    <button class="circ" id="btnMore" title="更多">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
    <button class="circ" id="btnCards" title="字卡库">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7l10-5z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/></svg>
    </button>
    <button class="circ send" id="btnSend" title="发送">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
    </button>
  </footer>
</div>

<div class="panel" id="stickerPanel" hidden>
  <div class="panel-head">
    <div class="panel-tabs">
      <button class="ptab active" data-stk="emoji">Emoji</button>
      <button class="ptab" data-stk="custom">自定义</button>
      <button class="ptab" data-stk="image">图片</button>
    </div>
    <button class="pclose" data-close="stickerPanel">✕</button>
  </div>
  <div class="panel-body" id="emojiPane">
    <div class="panel-tools">
      <input type="search" id="emojiSearch" placeholder="搜索表情 / 颜文字" />
      <button class="btn tiny" id="btnAddEmoji">+ 表情</button>
    </div>
    <div id="emojiGrid"></div>
  </div>
  <div class="panel-body" id="customPane" hidden>
    <div class="panel-tools">
      <button class="btn tiny" id="btnUploadSticker">＋ 批量添加图片</button>
      <span class="hint">可一次选多张，点一下混入消息</span>
    </div>
    <div id="customGrid" class="custom-grid"></div>
  </div>
  <div class="panel-body" id="imagePane" hidden>
    <div class="panel-tools">
      <button class="btn tiny" id="btnUploadImage">＋ 批量添加聊天图片</button>
      <span class="hint">发送过的图片会存在这里</span>
    </div>
    <div id="imageGrid" class="custom-grid"></div>
  </div>
</div>

<div class="overlay" id="callOverlay" hidden>
  <div class="call-bg"></div>
  <div class="call-top">
    <div class="call-name" id="callName">梦角</div>
    <div class="call-sub" id="callSub">正在呼叫…</div>
    <div class="call-timer" id="callTimer" hidden>00:00</div>
  </div>
  <div class="call-stage" id="callStage">
    <div class="call-ava-wrap" id="callAvaWrap">
      <div id="callAvatar" class="avatar txt xl"></div>
    </div>
    <div class="call-zoom-wrap">
      <span>缩放</span>
      <input type="range" id="callZoom" min="50" max="160" value="100" />
    </div>
    <div class="self-preview" id="selfPreview" hidden>
      <div id="selfPreviewImg"></div><span>本地画面（模拟）</span>
    </div>
    <div class="call-tip">模拟通话 · 不会录音或录像</div>
  </div>
  <div class="call-actions" id="callActions">
    <button class="cbtn danger" id="btnHangup"><span>✕</span><em id="hangupLabel">挂断</em></button>
    <button class="cbtn accept" id="btnAnswer" hidden><span>📞</span><em>接听</em></button>
  </div>
  <div class="call-tools">
    <button class="tool" id="btnMute">🔇<em>静音</em></button>
    <button class="tool" id="btnSpeaker">🔊<em>扬声器</em></button>
    <button class="tool" id="btnVideo">🎥<em>视频</em></button>
    <button class="tool" id="btnMinCall">🔽<em>收起</em></button>
  </div>
</div>

<div class="call-bubble" id="callBubble" hidden>
  <span id="bubbleAvatar" class="avatar txt sm"></span>
  <div class="bb-info">
    <div class="bb-name" id="bubbleName">梦角</div>
    <div class="bb-time" id="bubbleTimer">00:00</div>
  </div>
  <button class="bb-hang" id="bubbleHang" title="挂断">✕</button>
</div>

<div class="today-popup" id="todayPopup" hidden>
  <div class="tp-card">
    <div class="tp-date" id="todayDate"></div>
    <div class="tp-emo" id="todayEmo">🌙</div>
    <div class="tp-st" id="todaySt"></div>
    <div class="tp-note">梦角今天的心情状态（每小时刷新一次）</div>
    <button class="btn primary block" id="todayClose">知道了，开始今天</button>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head"><h3 id="modalTitle">标题</h3><button class="mclose" id="modalClose">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="pat-hint" id="patHint" hidden></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
